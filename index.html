<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bandito — Analítica de Instagram para agencias</title>
    <meta
      name="description"
      content="Bandito es analítica de Instagram para agencias, creadores y marcas: sigue el crecimiento, la interacción y la competencia de tus clientes en un solo panel. Beta gratuita."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        var t = "dark";
        try {
          if (localStorage.getItem("theme") === "light") t = "light";
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        if (t === "light") {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#faf8f5");
        }
      })();
    </script>
    <meta property="og:title" content="Bandito — Analítica de Instagram para agencias" />
    <meta
      property="og:description"
      content="Sigue el crecimiento, la interacción y la competencia de tus clientes de Instagram en un solo panel."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CL" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
